name: APK bauen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: APKs umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/wonderful-world-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/wonderful-world-${{ github.run_number }}-debug.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: wonderful-world-${{ github.run_number }}
          path: out/*.apk

      # Bei Tags (z. B. v1.0) zusätzlich ein GitHub-Release anlegen –
      # von dort lässt sich die APK direkt auf dem Handy herunterladen.
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/wonderful-world-${{ github.run_number }}.apk
